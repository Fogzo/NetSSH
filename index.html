<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>NetSSH</title>
    <style>
      html,body,#root{width:100%;height:100%;margin:0;background:#080b10}body{overflow:hidden}.startup-splash{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(68,181,137,.14),transparent 28%),#080b10;color:#e9eef4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.startup-splash-card{display:flex;flex-direction:column;align-items:center}.startup-mark{width:64px;height:64px;border:1px solid rgba(114,230,177,.28);border-radius:18px;background:linear-gradient(145deg,rgba(114,230,177,.18),rgba(121,167,255,.08));box-shadow:0 18px 55px rgba(0,0,0,.35),0 0 45px rgba(114,230,177,.08);display:grid;place-items:center}.startup-mark svg{width:35px;height:35px;stroke:#72e6b1;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.startup-splash strong{margin-top:18px;font-size:22px;letter-spacing:-.5px}.startup-splash span{margin-top:6px;color:#71808d;font-size:11px;letter-spacing:.3px}.startup-progress{width:150px;height:3px;margin-top:20px;border-radius:3px;background:#18232c;overflow:hidden}.startup-progress i{display:block;width:45%;height:100%;border-radius:3px;background:linear-gradient(90deg,#4cb88e,#72e6b1);animation:netssh-startup 1.1s ease-in-out infinite}@keyframes netssh-startup{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}@media(prefers-reduced-motion:reduce){.startup-progress i{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="root"><div class="startup-splash" role="status" aria-label="NetSSH is starting"><div class="startup-splash-card"><div class="startup-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="2"/><rect x="20" y="4" width="8" height="8" rx="2"/><rect x="12" y="20" width="8" height="8" rx="2"/><path d="M8 12v4h8m8-4v4h-8m0 0v4"/></svg></div><strong>NetSSH</strong><span>Preparing your network workspace…</span><div class="startup-progress"><i></i></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
