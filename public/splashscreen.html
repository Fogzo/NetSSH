<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>NetSSH is starting</title>
    <style>
      *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#080b10}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(68,181,137,.16),transparent 38%),#080b10;color:#e9eef4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:flex;flex-direction:column;align-items:center}.mark{width:70px;height:70px;border:1px solid rgba(114,230,177,.3);border-radius:20px;background:linear-gradient(145deg,rgba(114,230,177,.19),rgba(121,167,255,.08));box-shadow:0 20px 60px rgba(0,0,0,.38),0 0 50px rgba(114,230,177,.09);display:grid;place-items:center}.mark svg{width:38px;height:38px;stroke:#72e6b1;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}strong{margin-top:19px;font-size:24px;letter-spacing:-.6px}span{margin-top:7px;color:#83919d;font-size:13px}.progress{width:170px;height:4px;margin-top:22px;border-radius:4px;background:#18232c;overflow:hidden}.progress i{display:block;width:42%;height:100%;border-radius:4px;background:linear-gradient(90deg,#45aa82,#72e6b1);animation:loading 1.1s ease-in-out infinite}@keyframes loading{0%{transform:translateX(-115%)}100%{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.progress i{width:100%;animation:none}}
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-label="NetSSH is starting">
      <div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="2"/><rect x="20" y="4" width="8" height="8" rx="2"/><rect x="12" y="20" width="8" height="8" rx="2"/><path d="M8 12v4h8m8-4v4h-8m0 0v4"/></svg></div>
      <strong>NetSSH</strong>
      <span>Preparing your network workspace…</span>
      <div class="progress" aria-hidden="true"><i></i></div>
    </main>
  </body>
</html>
